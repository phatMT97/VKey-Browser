<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VKey Browser</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <main>
    <p class="eyebrow">VKEY BROWSER</p>
    <h1 id="hostname">Trang hiện tại</h1>
    <label class="master-toggle">
      <span>
        <strong>Bật điều hướng theo website</strong>
        <small>Tắt để tạm dùng VKey như bình thường</small>
      </span>
      <input id="enabled" type="checkbox" role="switch">
    </label>
    <p id="connection" class="connection" data-state="connecting" role="status">Đang kết nối VKey…</p>
    <fieldset id="routes">
      <label><input type="radio" name="route" value="default"> Tự nhớ V/E theo hotkey</label>
      <label><input type="radio" name="route" value="english"> Luôn gõ English (hard)</label>
      <label><input type="radio" name="route" value="tsf"> TSF tương thích (hard)</label>
    </fieldset>
    <p id="remembered" class="remembered"></p>
    <p id="status" role="status"></p>
    <button id="options" type="button">Quản lý tất cả tên miền</button>
  </main>
  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
